<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aria — Personal Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="chat-container">

    <!-- Header -->
    <div class="chat-header">
      <span class="dot"></span>
      My AI Agent
    </div>

    <!-- Message area -->
<div class="message ai">
  Hi there! I'm Aria, your personal assistant. I can help you with anything — questions, ideas, planning, advice, or just a chat. What's on your mind? 😊
</div>

    <!-- Input area -->
    <div class="chat-input-area">
      <input
        type="text"
        id="user-input"
        placeholder="Type your message..."
        autocomplete="off"
      />
      <button id="send-btn">Send</button>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
